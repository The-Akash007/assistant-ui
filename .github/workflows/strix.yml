name: Strix Security Scan
permissions:
  contents: read
  security-events: write

on:
  push:        # runs on all branches
  pull_request: # runs on all PRs to any branch
  workflow_dispatch: # manual run
  workflow_call: # reusable from other workflows

jobs:
  strix-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Strix CLI (from GitHub)
        run: |
          echo "Installing Strix CLI from GitHub repository usestrix/strix..."
          if ! pip install git+https://github.com/usestrix/strix.git 2>/dev/null; then
            echo "Direct pip install failed, trying alternative method..."
            git clone https://github.com/usestrix/strix.git /tmp/strix
            cd /tmp/strix
            pip install -e .
          fi
          echo "Installed: $(command -v strix || echo 'not found')"
      
      - name: Run Strix security scan
        id: strix_scan
        env:
          STRIX_LLM_API_KEY: ${{ secrets.STRIX_LLM_API_KEY }}
        run: |
          set -o pipefail
          # Ensure the CLI is available
          if ! command -v strix >/dev/null 2>&1; then
            echo "strix: command not found after install. Aborting scan."
            echo "scan_exit_code=127" >> $GITHUB_OUTPUT
            exit 1
          fi
          # Run the scan and produce SARIF. Allow the scan command to return non-zero so we capture the exit code.
          strix scan --format sarif --output strix-report.sarif || true
          echo "scan_exit_code=$?" >> $GITHUB_OUTPUT

      - name: Check SARIF and set output
        id: check_sarif
        run: |
          if [ -f strix-report.sarif ]; then
            echo "file_exists=true" >> $GITHUB_OUTPUT
            ls -l strix-report.sarif
          else
            echo "file_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Strix SARIF report (artifact)
        if: steps.check_sarif.outputs.file_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: strix-report
          path: strix-report.sarif

      - name: Upload SARIF to GitHub Code Scanning
        if: steps.check_sarif.outputs.file_exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: strix-report.sarif

      - name: Fail workflow on non-zero scan exit
        if: steps.strix_scan.outputs.scan_exit_code != '0'
        run: |
          echo "Strix scan exited with code ${{ steps.strix_scan.outputs.scan_exit_code }} — failing job"
          exit ${{ steps.strix_scan.outputs.scan_exit_code }}
