version: 2
updates:
  # JavaScript/TypeScript dependencies
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 10
    reviewers:
      - The-Akash007
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: "chore(deps):"
      prefix-development: "chore(deps-dev):"
      include: "scope"
    allow:
      - dependency-type: "production"
      - dependency-type: "development"
    ignore:
      # Add any packages to ignore here if needed
      # - dependency-name: "package-name"
    pull-request-branch-name:
      separator: "/"

  # Python dependencies
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 5
    reviewers:
      - The-Akash007
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps):"
      prefix-development: "chore(deps-dev):"
    pull-request-branch-name:
      separator: "/"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - The-Akash007
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci(deps):"
    pull-request-branch-name:
      separator: "/"

  # Docker (if applicable)
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - The-Akash007
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(deps):"

# Global configuration
enableVulnerabilityAlerts: true
enableSecurityUpdates: true
